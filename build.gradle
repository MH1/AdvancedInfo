import java.time.ZoneOffset
import java.time.ZonedDateTime

plugins {
    id 'java'
}

// -------------------------------------------------------------------------
// Version assembly
//
// release_type (set in gradle.properties) controls the jar name:
//
//   TEST     -> 1.0.0.<buildNumber>   (internal only, unique per commit)
//   SNAPSHOT -> 1.0.0-SNAPSHOT        (alpha / pre-release; bump plugin_version before tagging)
//   RELEASE  -> 1.0.0                 (production;          bump plugin_version before tagging)
//
// manifestVersion follows the same tier but is always valid semver
// (<major>.<minor>.<patch> or <major>.<minor>.<patch>-<pre-release>):
//
//   TEST     -> 1.0.0-dev.<buildNumber>   (pre-release tag keeps it 3-segment)
//   SNAPSHOT -> 1.0.0-SNAPSHOT
//   RELEASE  -> 1.0.0
//
// buildNumber is the commit count of HEAD so it is monotonic and reproducible;
// outside a git checkout it falls back to seconds-of-day.
// -------------------------------------------------------------------------

def buildNumber = providers.exec {
    commandLine 'git', 'rev-list', '--count', 'HEAD'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() }.getOrElse('')
if (!buildNumber.isInteger()) {
    buildNumber = ZonedDateTime.now(ZoneOffset.UTC).toLocalTime().toSecondOfDay().toString()
}
def tier = (release_type ?: 'TEST').trim().toUpperCase()

def manifestVersion
switch (tier) {
    case 'RELEASE':
        version         = plugin_version
        manifestVersion = plugin_version
        break
    case 'SNAPSHOT':
        version         = plugin_version + '-SNAPSHOT'
        manifestVersion = plugin_version + '-SNAPSHOT'
        break
    default: // TEST
        version         = plugin_version + '.' + buildNumber
        manifestVersion = plugin_version + '-dev.' + buildNumber
        break
}

jar {
    archiveBaseName = 'AdvancedInfo'
    archiveVersion  = version as String
    archiveClassifier = ''
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

// Quiet warnings about missing Javadocs.
javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

repositories {
    mavenCentral()
    maven { url = "https://maven.hytale-modding.info/releases" }
}

// -------------------------------------------------------------------------
// Hytale server jar lookup (compile-time dependency).
//
// Resolution order:
//   1. HYTALE_SERVER_JAR environment variable
//   2. hytale_server_jar Gradle property (put it in ~/.gradle/gradle.properties)
//   3. the official launcher install location for the current OS
// -------------------------------------------------------------------------
def resolveHytaleServerJar = {
    def candidates = []
    def env = System.getenv('HYTALE_SERVER_JAR')
    if (env) { candidates << file(env) }
    if (project.hasProperty('hytale_server_jar')) { candidates << file(project.property('hytale_server_jar')) }

    def home = System.getProperty('user.home')
    def os = System.getProperty('os.name').toLowerCase()
    def hytaleHomes = os.contains('win') ? ["${home}/AppData/Roaming/Hytale"]
                    : os.contains('mac') ? ["${home}/Library/Application Support/Hytale"]
                    : ["${home}/.local/share/Hytale", "${home}/.var/app/com.hypixel.HytaleLauncher/data/Hytale"]
    hytaleHomes.each { candidates << file("${it}/install/${patchline}/package/game/latest/Server/HytaleServer.jar") }

    def found = candidates.find { it.isFile() }
    if (found == null) {
        throw new GradleException(
            "HytaleServer.jar not found. Checked:\n  " + candidates*.path.join("\n  ") +
            "\nSet hytale_server_jar in ~/.gradle/gradle.properties or the HYTALE_SERVER_JAR environment variable.")
    }
    logger.info("Using Hytale server jar: ${found}")
    return found
}

dependencies {
    implementation(files(provider(resolveHytaleServerJar)))

    testImplementation(platform("org.junit:junit-bom:5.11.4"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.named('test') {
    useJUnitPlatform()
}

// Fill version fields of manifest.json at build time; the tracked file keeps placeholders.
tasks.named('processResources') {
    def manifestProps = [pluginVersion: manifestVersion, serverVersion: server_version]
    inputs.properties(manifestProps)
    filesMatching('manifest.json') {
        expand(manifestProps)
    }
}

// -------------------------------------------------------------------------
// Local deployment.
//
// hytale_mods_dir (Gradle property or HYTALE_MODS_DIR env) is the mods folder
// the jar is copied into: <server>/mods for a dedicated server or
// <Hytale>/UserData/Mods for singleplayer.
// -------------------------------------------------------------------------
def resolveHytaleModsDir = {
    def dir = System.getenv('HYTALE_MODS_DIR') ?: project.findProperty('hytale_mods_dir')
    if (!dir) {
        throw new GradleException("Set hytale_mods_dir in ~/.gradle/gradle.properties or the HYTALE_MODS_DIR environment variable.")
    }
    return file(dir)
}

tasks.register('deployToServer', Copy) {
    group = 'hytale'
    description = 'Copies the plugin jar into the configured Hytale mods folder (hytale_mods_dir).'
    from(tasks.named('jar'))
    into(provider { resolveHytaleModsDir() })
    doFirst {
        // Remove stale builds so the server never loads two versions of the plugin.
        fileTree(dir: destinationDir, include: 'AdvancedInfo-*.jar').each { it.delete() }
    }
}
